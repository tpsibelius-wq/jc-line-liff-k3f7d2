<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<!-- JavaScriptが動かない端末向けの保険: 2秒後に友だち追加URLへ（下の ADD_URL と同じURLにする） -->
<meta http-equiv="refresh" content="2;url=https://lin.ee/NMLj2g7">
<title>沼津JC公式LINE</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; text-align: center; padding: 48px 16px; color: #333; }
  a { color: #06c; }
</style>
</head>
<body>
<p>LINEの友だち追加画面を開いています…</p>
<p><a id="lnk" href="#">開かない場合はこちらをタップ</a></p>
<script src="config.js?v=202609071748"></script>
<script>
// QRの飛び先ページ: どのQRから来たか（src）を記録してから、LINEの友だち追加画面へ転送する
// ADD_URL = LINE公式アカウントの友だち追加URL（Official Account Manager →「友だちを増やす」で表示される lin.ee のURL）
// 本番移行時は config.js の ADD_URL と、上の meta refresh の URL を差し替える（JS が動かない端末向けの保険なので両方）
var ADD_URL = (window.JC_CONFIG || {}).ADD_URL || "https://lin.ee/NMLj2g7";
var API = (window.JC_CONFIG || {}).API || "";

var src = "";
try { src = (new URLSearchParams(location.search).get("src") || "").slice(0, 40); } catch (e) {}
document.getElementById("lnk").href = ADD_URL;

var moved = false;
function go(){ if (moved) return; moved = true; location.replace(ADD_URL); }
try {
  fetch(API, { method: "POST", body: JSON.stringify({ action: "liff_entry", src: src, ua: navigator.userAgent }), keepalive: true })
    .then(go, go);
} catch (e) { go(); }
setTimeout(go, 800); // 記録が遅くても0.8秒で転送する
</script>
</body>
</html>
